# nginx configuration for the site's container. The Dockerfile copies it to
# /etc/nginx/conf.d/default.conf, which the base image's main nginx.conf
# includes inside its http {} block. That's why this file starts at `server {`.
#
# How a visit reaches this file: browser -> Cloudflare (HTTPS) -> Cloudflare
# Tunnel -> NodePort 30738 on the Pi -> Service -> one of the pods -> nginx on
# port 8080. HTTPS ends at Cloudflare; the last hop, inside the Pi, is plain
# HTTP. There's no application server: nginx serves the files that
# `npm run build` put in dist/, and adds the headers below.
#
# Try it, with the container running (docker run --rm -p 8080:8080 portfolio):
#   curl -sI http://localhost:8080/            the response headers set below
#   docker run --rm portfolio nginx -T         the full config nginx really loads
# Learn more: https://nginx.org/en/docs/beginners_guide.html

# A server block is one website. Inside it, `location` blocks decide how each
# URL path is handled. An exact match (`location = /path`) wins outright;
# otherwise the longest matching prefix does, so `location /assets/` beats
# `location /`. (Regex locations, not used here, follow their own rules.)
server {
    # 8080, not 80: the container runs as a non-root user (see the Dockerfile).
    listen 8080;
    # "_" is the usual placeholder for "any hostname". As the only server on this
    # port, this block answers every request whatever the Host header says.
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Kubernetes liveness/readiness probes hit this (k8s/base/deployment.yaml).
    # nginx answers it itself without reading any file, and doesn't log it: the
    # probes call it every few seconds and would bury the real visits.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The add_header gotcha: a location inherits the server block's add_header
    # lines only if it has no add_header of its own. One add_header here would
    # silently drop every security header below, for this path only. `expires`
    # is a different directive, so it's safe; the CI smoke test checks that
    # /version.json still gets the security headers.
    # `expires -1` sends "Cache-Control: no-cache": a browser must check back
    # with the server before reusing its copy, so this always shows the commit
    # that is live right now.
    # Learn more: https://nginx.org/en/docs/http/ngx_http_headers_module.html
    location = /version.json {
        expires -1;
    }

    # The page itself and the résumé change with every deploy but keep their
    # names, so they get the same treatment: browsers may keep a copy but must
    # check it's still current (a quick 304 Not Modified when it is). Without
    # any Cache-Control, browsers guess a lifetime from Last-Modified and could
    # show the old page after a deploy. "/" is covered too: nginx's `index`
    # directive serves it internally as /index.html.
    location = /index.html {
        expires -1;
    }
    location = /resume.pdf {
        expires -1;
    }

    # security.txt (RFC 9116) tells security researchers how to report a
    # problem. The standard asks for "Content-Type: text/plain; charset=utf-8";
    # `charset` adds the "; charset=utf-8" part.
    location = /.well-known/security.txt {
        default_type text/plain;
        charset utf-8;
    }

    # Long caching for build assets. Vite puts a hash of each file's contents in
    # its name (assets/index-<hash>.js), so a changed file always gets a new
    # URL, and a URL's content never changes. Browsers may therefore reuse these
    # for a year ("Cache-Control: max-age=31536000") without asking again.
    # Files whose names stay the same across deploys, like index.html, must not
    # get this, or visitors would keep seeing the old page.
    # (`expires`, not add_header, so the security headers below still apply.)
    location /assets/ {
        expires 1y;
    }

    # Everything else: the file itself ($uri), else that folder's index.html
    # ($uri/), else 404. A single-page app with client-side routes would fall
    # back to /index.html here instead; this site has no routes (the nav jumps
    # to #sections on one page), so an unknown path is an honest 404.
    location / {
        try_files $uri $uri/ =404;
    }

    # Security headers, on every response from this server (mind the add_header
    # gotcha above). `always` adds them to error pages too; without it, nginx
    # skips them on 4xx/5xx responses. Besides protecting visitors, web filters
    # and reputation scanners score them when they decide whether a site is safe.
    # Learn more: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers

    # HSTS (HTTP Strict Transport Security): "use only HTTPS for this site for
    # the next year (31536000 seconds)". After one visit the browser upgrades
    # every http:// link to this site to https:// by itself, so an attacker on
    # the same Wi-Fi can't downgrade the connection to plain HTTP (an "SSL
    # stripping" attack). Without includeSubDomains, it covers this exact host.
    # Browsers ignore this header when it arrives over plain HTTP, so it only
    # takes effect as delivered by Cloudflare over HTTPS.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Content-Security-Policy (CSP): an allowlist of where the page may load
    # things from. Its main job is to defuse cross-site scripting (XSS): even if
    # an attacker slipped HTML into the page, the browser wouldn't run it.
    #   default-src 'self'         scripts, styles, fonts... only from this site,
    #                              and no inline <script>, <style> or style=""
    #                              (tests/prerender.test.ts keeps them out)
    #   img-src 'self' data:       images may also be inline data: URLs
    #   object-src 'none'          no plugin content (<object>, <embed>)
    #   base-uri 'none'            no <base> tag, which could repoint relative URLs
    #   form-action 'none'         forms can't submit anywhere (the site has none)
    #   frame-ancestors 'none'     no site may show this page inside a frame,
    #                              which stops clickjacking (an invisible frame
    #                              that tricks visitors into clicking)
    #   upgrade-insecure-requests  fetch any http:// resource over https://
    # Everything loads from this site only ('self'), including the email
    # decoder script Cloudflare can inject: it's served from /cdn-cgi/ on this
    # same domain.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    # Switch off powerful browser features the site never uses. "()" means
    # "allowed for nobody", so no script can even ask for the camera, the
    # microphone, the visitor's location, payments or USB devices.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # Trust the Content-Type header and never guess the type from the content
    # ("MIME sniffing"), so a file served as text can't be run as a script.
    add_header X-Content-Type-Options "nosniff" always;
    # The older way to say frame-ancestors 'none'; kept for old browsers and for
    # scanners that look for it.
    add_header X-Frame-Options "DENY" always;
    # When a visitor follows a link to another site, tell that site only
    # "https://ttaekratok.com/", never the full URL of the page they came from
    # (and nothing at all when going from HTTPS to plain HTTP).
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compress text responses on the fly; text shrinks a lot. text/html is
    # always compressed once gzip is on. Images and fonts (PNG, WOFF2) are
    # compressed formats already, so they aren't listed.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
}
