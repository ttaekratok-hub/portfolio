server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Kubernetes liveness/readiness probes hit this.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Uses `expires`, not add_header: a location with its own add_header
    # silently drops every add_header from the server block below.
    location = /version.json {
        expires -1;
    }

    location = /.well-known/security.txt {
        default_type text/plain;
        charset utf-8;
    }

    # Vite puts a content hash in every asset's file name, so a changed file
    # always gets a new URL: browsers may cache these for a year. (`expires`,
    # not add_header, so the security headers below still apply.)
    location /assets/ {
        expires 1y;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Security headers. Besides protecting visitors, web filters and
    # reputation scanners score them when they decide whether a site is safe.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Everything loads from this site only ('self'), including the email
    # decoder script Cloudflare injects under /cdn-cgi/.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
}
