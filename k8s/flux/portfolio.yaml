# Flux on the Pi pulls the `deploy` branch and applies k8s/overlays/pi.
# CI rewrites that branch after every check passed (see ci-cd.yml); it holds
# only k8s/, with the image pinned to the tested commit.
#
# Needs the Secret flux-system/portfolio-git (a read-only GitHub deploy key),
# created with `kubectl create secret`, never committed.
#
# GitOps: git holds the desired state, and an agent inside the cluster keeps
# the cluster matching it. Flux is that agent: a set of controllers (programs
# running in the flux-system namespace) that add their own object kinds to the
# Kubernetes API, like the two below. Flux reconciles each object: on a timer,
# it compares what git says with what the cluster has, and fixes differences.
# It pulls: Flux connects out to GitHub, and nothing connects in to the Pi.
#   GitRepository  source-controller fetches the branch and keeps its latest
#                  commit ready for other Flux objects to use.
#   Kustomization  kustomize-controller builds a folder of that commit with
#                  kustomize and applies the result to the cluster.
#
# Try it (on the Pi):
#   kubectl -n flux-system get gitrepository,kustomization portfolio   (Ready?)
#   kubectl -n flux-system describe kustomization portfolio            (events)
# Learn more: https://fluxcd.io/flux/components/source/gitrepositories/
#   and https://fluxcd.io/flux/components/kustomize/kustomizations/
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: portfolio
  namespace: flux-system
spec:
  # Check the branch for a new commit every minute.
  interval: 1m
  url: ssh://git@github.com/ttaekratok-hub/portfolio
  ref:
    branch: deploy
  secretRef:
    name: portfolio-git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: portfolio
  namespace: flux-system
spec:
  # Explicit, so `kubectl apply -k k8s/flux` also undoes a `kubectl patch`
  # pause (apply leaves alone fields its file never mentioned).
  suspend: false
  # Re-applied whenever the deploy branch moves, and every 10m regardless,
  # which undoes any manual `kubectl edit` drift.
  interval: 10m
  # After a failed attempt, try again every minute instead of every 10.
  retryInterval: 1m
  # Which source to read (the GitRepository above), and which folder in it.
  sourceRef:
    kind: GitRepository
    name: portfolio
  path: ./k8s/overlays/pi
  # Least privilege: apply as portfolio-reconciler (k8s/tenant/rbac.yaml),
  # which can only manage the site's Deployment and Service.
  serviceAccountName: portfolio-reconciler
  # Put every object in the portfolio namespace, whatever its YAML says.
  targetNamespace: portfolio
  # Flux records what it applied, which is how it knows what to prune.
  prune: true # delete objects that were removed from git
  wait: true # only Ready once the Deployment's rollout has finished
  # How long one apply-and-wait may take before it counts as failed.
  timeout: 3m
