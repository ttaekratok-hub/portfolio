apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The portfolio's sandbox on a shared cluster: namespace + resource cap,
# Flux's limited account, and network guardrails. Owned by the cluster admin.
# CI's kind cluster applies the same files, so it tests under the Pi's rules.
#
# A "tenant" is one occupant of a shared cluster; the Pi also runs a mail server
# and other apps. These files set the limits on what Flux may deploy for the
# site, so Flux itself must not be able to change them: they are applied by
# hand with `kubectl apply -k k8s/flux` (which includes this folder), never
# from the deploy branch. Each layer stops something different:
#   namespace.yaml   Pod Security (no root or privileged pods) and a quota
#   rbac.yaml        which objects Flux's account may create or change
#   guardrails.yaml  where network traffic may go, and which Services are allowed
resources:
  - namespace.yaml
  - rbac.yaml
  - guardrails.yaml
