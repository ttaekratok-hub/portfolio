<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Tichakorn Taekratok — Software, Infrastructure &amp; Technical Art</title>
    <meta
      name="description"
      content="Portfolio of Tichakorn &quot;Tweety&quot; Taekratok: Kubernetes, CI/CD and network infrastructure projects, software engineering and art.">
    <!-- The site is always dark: scrollbars, form controls and mobile browser bars too. -->
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#03040a">
    <link rel="canonical" href="https://ttaekratok.com/">
    <!-- ?v=N: bump it whenever an icon changes. Browsers keep icons in a cache
         of their own, and Cloudflare keeps copies too; a new URL makes them
         all fetch the new file at once. -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="32x32">
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">

    <!-- How the link looks when shared on LinkedIn, iMessage, Slack… -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ttaekratok.com/">
    <meta property="og:title" content="Tichakorn “Tweety” Taekratok">
    <meta property="og:description" content="Software &amp; Infrastructure Engineer · Technical Artist">
    <meta property="og:image" content="https://ttaekratok.com/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
  </head>
  <body>
    <!-- scripts/prerender.mjs replaces the comment below with the rendered page. -->
    <div id="root"><!--app-html--></div>
    <!-- Entry point. The build replaces it with hashed /assets/ files, linked in <head>. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
